<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wireframe Registro — RendiYa</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <div class="pair">
    <div class="browser">
      <div class="chrome">
        <span class="dots"><i></i><i></i><i></i></span>
        <div class="url">http://www.rendiya.com/registro</div>
        <span class="chrome-title">Registro</span>
      </div>
      <div class="viewport">
        <div class="ximg logo-box" style="margin:0 auto 12px"></div>
        <h1 style="text-align:center">Crear cuenta</h1>
        <form class="form" style="max-width:360px;margin:0 auto">
          <div class="campo"><label>Nombre y apellido</label><input /></div>
          <div class="campo"><label>DNI</label><input /></div>
          <div class="campo"><label>Email</label><input type="email" /></div>
          <div class="campo"><label>Teléfono</label><input /></div>
          <div class="campo"><label>Contraseña</label><input type="password" /></div>
          <div class="campo"><label>Repetir contraseña</label><input type="password" /></div>
          <label><input type="checkbox" /> Acepto términos</label>
          <p><span class="btn-fake">Registrarme</span></p>
          <p>¿Ya tenés cuenta? <a href="login.html">Ingresá</a></p>
        </form>
      </div>
    </div>
    <div class="phone">
      <div class="phone-screen">
        <div class="ph-bar">☰ <span>Registro</span></div>
        <div class="ximg ph-logo"></div>
        <form class="form">
          <div class="campo"><label>Nombre</label><input /></div>
          <div class="campo"><label>Email</label><input /></div>
          <div class="campo"><label>Contraseña</label><input type="password" /></div>
          <p><span class="btn-fake">Registrarme</span></p>
          <p><a href="login.html">Ingresar</a></p>
        </form>
      </div>
    </div>
  </div>
  <p class="caption">Wireframe · Registro · escritorio y celular</p>
</body>
</html>
