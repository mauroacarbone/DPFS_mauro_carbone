<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wireframe Login — RendiYa</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <div class="pair">
    <div class="browser">
      <div class="chrome">
        <span class="dots"><i></i><i></i><i></i></span>
        <div class="url">http://www.rendiya.com/login</div>
        <span class="chrome-title">Login</span>
      </div>
      <div class="viewport">
        <div class="ximg logo-box" style="margin:0 auto 12px"></div>
        <h1 style="text-align:center">Ingresar</h1>
        <form class="form" style="max-width:320px;margin:0 auto">
          <div class="campo"><label>Email</label><input type="email" /></div>
          <div class="campo"><label>Contraseña</label><input type="password" /></div>
          <p><a href="#">Olvidé mi contraseña</a></p>
          <p><span class="btn-fake">Ingresar</span></p>
          <p>¿No tenés cuenta? <a href="registro.html">Registrate</a></p>
        </form>
      </div>
    </div>
    <div class="phone">
      <div class="phone-screen">
        <div class="ph-bar">☰ <span>Login</span></div>
        <div class="ximg ph-logo"></div>
        <form class="form">
          <div class="campo"><label>Email</label><input /></div>
          <div class="campo"><label>Contraseña</label><input type="password" /></div>
          <p><span class="btn-fake">Ingresar</span></p>
          <p><a href="registro.html">Registrarse</a></p>
        </form>
      </div>
    </div>
  </div>
  <p class="caption">Wireframe · Login · escritorio y celular</p>
</body>
</html>
