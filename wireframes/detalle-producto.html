<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wireframe Detalle — RendiYa</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <div class="pair">
    <div class="browser">
      <div class="chrome">
        <span class="dots"><i></i><i></i><i></i></span>
        <div class="url">http://www.rendiya.com/vehiculo</div>
        <span class="chrome-title">Detalle de producto</span>
      </div>
      <div class="viewport">
        <div class="top">
          <div class="ximg logo-box"></div>
          <div class="util"><a href="home.html">Inicio</a> · <a href="carrito.html">Carrito</a></div>
        </div>
        <p class="crumbs"><a href="home.html">Inicio</a> / Vehículos / Fiat Cronos</p>
        <div class="detalle">
          <div>
            <div class="ximg lg"></div>
            <div class="grid" style="margin-top:8px;grid-template-columns:repeat(4,1fr)">
              <div class="ximg sm"></div><div class="ximg sm"></div><div class="ximg sm"></div><div class="ximg sm"></div>
            </div>
          </div>
          <div>
            <h1>Fiat Cronos 1.3</h1>
            <p>Auto · CABA · Clase B</p>
            <p><strong>$45.000 / turno</strong></p>
            <div class="form">
              <div class="campo"><label>Fecha del examen</label><input type="date" /></div>
              <div class="campo">
                <label>Franja</label>
                <select><option>08:00 – 11:00</option><option>11:00 – 14:00</option></select>
              </div>
              <label><input type="checkbox" /> Instructor (+$15.000)</label>
              <label><input type="checkbox" /> Práctica previa (+$12.000)</label>
              <p><a class="btn-fake" href="carrito.html">Agregar al carrito</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="phone">
      <div class="phone-screen">
        <div class="ph-bar">☰ <span>Detalle</span> 🛒</div>
        <div class="ximg lg"></div>
        <p><strong>Fiat Cronos</strong><br />$45.000</p>
        <p><a href="carrito.html">Agregar al carrito</a></p>
      </div>
    </div>
  </div>
  <p class="caption">Wireframe · Detalle de producto · escritorio y celular</p>
</body>
</html>
